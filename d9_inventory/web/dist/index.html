    <style>
      /* Ultra performance mode: minimize UI animation work for huge inventories */
      .transition,
      .transition-all,
      .itembox {
        transition: none !important;
        animation: none !important;
      }

      /* Lightweight inventory open/close animation */
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1) !important;
      }
      .fade-enter-from,
      .fade-leave-to {
        opacity: 0 !important;
        transform: translateY(10px) scale(0.985) !important;
      }
      .fade-enter-to,
      .fade-leave-from {
        opacity: 1 !important;
        transform: translateY(0) scale(1) !important;
      }

      /* Let browser skip offscreen rendering work in long item lists */
      .Myinventorylist,
      .Secondinventorylist {
        content-visibility: auto;
        contain-intrinsic-size: 800px 600px;
      }

      /* Reduce heavy paint effects (blur/filter/shadow) for max FPS */
      .blur-sm,
      .filter,
      .grayscale {
        filter: none !important;
      }

      * {
        text-shadow: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
